AWSTemplateFormatVersion: '2010-09-09'
Description: CloudOpsHub - Requests table (imported from existing)

Resources:
  RequestsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: CloudOpsHubRequests
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: requestId
          AttributeType: S
      KeySchema:
        - AttributeName: requestId
          KeyType: HASH

  NotificationsTopic:
    Type: AWS::SNS::Topic
    DeletionPolicy: Retain
    Properties:
      TopicName: CloudOpsHubNotifications
